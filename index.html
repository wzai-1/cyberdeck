<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberDeck</title>

    <!-- Open Graph / Social -->
    <meta property="og:title" content="CyberDeck — Neural Combat System" />
    <meta property="og:description" content="A cyberpunk roguelike deckbuilder. Hack. Survive. Repeat." />
    <meta property="og:image" content="/cyberdeck/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="description" content="CyberDeck — a cyberpunk roguelike deckbuilder. Build your deck, hack the system, defeat the boss." />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0f;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }

      /* Loading screen */
      #loading {
        position: fixed;
        inset: 0;
        background: #030810;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-family: "Courier New", Courier, monospace;
        color: #00ffcc;
        transition: opacity 0.5s ease;
      }
      #loading .logo {
        font-size: 42px;
        font-weight: bold;
        letter-spacing: 8px;
        text-shadow: 0 0 24px #00ffcc88;
        margin-bottom: 18px;
      }
      #loading .sub {
        font-size: 13px;
        color: #336677;
        letter-spacing: 4px;
        margin-bottom: 32px;
      }
      #loading .bar-track {
        width: 220px;
        height: 6px;
        background: #0a1822;
        border: 1px solid #224455;
        border-radius: 3px;
        overflow: hidden;
      }
      #loading .bar-fill {
        height: 100%;
        background: #00ffcc;
        border-radius: 3px;
        animation: loadprog 1.2s ease-out forwards;
        box-shadow: 0 0 10px #00ffcc88;
      }
      @keyframes loadprog {
        from { width: 0%; }
        to   { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="logo">CYBERDECK</div>
      <div class="sub">INITIALIZING NEURAL LINK...</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', function() {
        var el = document.getElementById('loading');
        if (!el) return;
        setTimeout(function() {
          el.style.opacity = '0';
          setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 520);
        }, 1400);
      });
    </script>
  </body>
</html>
